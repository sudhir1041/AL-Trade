version: "3.9"

x-backend-common: &backend-common
  build:
    context: ./backend
    dockerfile: Dockerfile
    target: production
  env_file:
    - .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  networks:
    - trademind_network

services:
  # ─────────────────────────────────────────
  # Infrastructure
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: trademind_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - trademind_network
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: trademind_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - trademind_network
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: trademind_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_VM_MEMORY_HIGH_WATERMARK: 0.6
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - trademind_network

  # ─────────────────────────────────────────
  # Application Services
  # ─────────────────────────────────────────
  api:
    <<: *backend-common
    container_name: trademind_api
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 4
      --worker-class gthread
      --threads 2
      --timeout 120
      --graceful-timeout 30
      --max-requests 1000
      --max-requests-jitter 100
      --access-logfile -
      --error-logfile -
      --log-level info
    volumes:
      - ./backend:/app
      - static_files:/app/staticfiles
      - media_files:/app/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  fastapi:
    <<: *backend-common
    container_name: trademind_fastapi
    command: >
      uvicorn services.fastapi_app:app
      --host 0.0.0.0
      --port 8001
      --workers 2
      --loop uvloop
      --http httptools
      --log-level info
    volumes:
      - ./backend:/app
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─────────────────────────────────────────
  # Celery Workers
  # ─────────────────────────────────────────
  celery_worker:
    <<: *backend-common
    container_name: trademind_celery_worker
    command: >
      celery -A config.celery worker
      --loglevel=info
      --concurrency=4
      --queues=default,reports,backtest,portfolio_sync,order_sync
      --hostname=worker@%h
      --max-tasks-per-child=200
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend:/app

  celery_beat:
    <<: *backend-common
    container_name: trademind_celery_beat
    command: >
      celery -A config.celery beat
      --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  scanner_worker:
    <<: *backend-common
    container_name: trademind_scanner_worker
    command: >
      celery -A config.celery worker
      --loglevel=info
      --queues=scanner
      --concurrency=8
      --hostname=scanner@%h
      --max-tasks-per-child=500
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend:/app

  ai_worker:
    <<: *backend-common
    container_name: trademind_ai_worker
    command: >
      celery -A config.celery worker
      --loglevel=info
      --queues=ai_scoring,ml_training
      --concurrency=4
      --hostname=ai@%h
      --max-tasks-per-child=100
    volumes:
      - ./backend:/app
      - ml_models:/app/ml_models

  notification_worker:
    <<: *backend-common
    container_name: trademind_notification_worker
    command: >
      celery -A config.celery worker
      --loglevel=info
      --queues=notifications
      --concurrency=2
      --hostname=notifications@%h
      --max-tasks-per-child=1000
    volumes:
      - ./backend:/app

  # ─────────────────────────────────────────
  # Reverse Proxy
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: trademind_nginx
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - fastapi
    ports:
      - "80:80"
      - "443:443"
    networks:
      - trademind_network

  # ─────────────────────────────────────────
  # Monitoring Stack
  # ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: trademind_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - trademind_network

  grafana:
    image: grafana/grafana:latest
    container_name: trademind_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_INSTALL_PLUGINS: "grafana-clock-panel,grafana-piechart-panel"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    ports:
      - "3001:3000"
    networks:
      - trademind_network

  loki:
    image: grafana/loki:latest
    container_name: trademind_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - trademind_network

# ─────────────────────────────────────────
# Networks
# ─────────────────────────────────────────
networks:
  trademind_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ─────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  grafana_data:
    driver: local
  prometheus_data:
    driver: local
  loki_data:
    driver: local
  static_files:
    driver: local
  media_files:
    driver: local
  ml_models:
    driver: local
