# =============================================================================
# TradeMind AI – Nginx Configuration
# Production-grade reverse proxy with WebSocket, gzip, and security headers
# =============================================================================

worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─────────────────────────────────────────
    # Logging
    # ─────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # ─────────────────────────────────────────
    # Performance
    # ─────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  75s;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens      off;

    # ─────────────────────────────────────────
    # Buffer / Timeout tuning
    # ─────────────────────────────────────────
    client_body_buffer_size     128k;
    client_header_buffer_size   1k;
    large_client_header_buffers 4 8k;
    client_max_body_size        10M;

    proxy_read_timeout    300s;
    proxy_connect_timeout  60s;
    proxy_send_timeout    300s;
    proxy_buffers         8 32k;
    proxy_buffer_size     64k;

    # ─────────────────────────────────────────
    # Gzip Compression
    # ─────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # ─────────────────────────────────────────
    # Rate Limiting Zones
    # ─────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m    rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m   rate=10r/m;
    limit_req_zone $binary_remote_addr zone=ws_limit:10m     rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ─────────────────────────────────────────
    # Upstreams
    # ─────────────────────────────────────────
    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    upstream fastapi_backend {
        server fastapi:8001;
        keepalive 32;
    }

    # ─────────────────────────────────────────
    # WebSocket upgrade map
    # ─────────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ─────────────────────────────────────────
    # HTTP Server – port 80
    # ─────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ── Security Headers ──────────────────
        add_header X-Frame-Options           "SAMEORIGIN"         always;
        add_header X-XSS-Protection          "1; mode=block"      always;
        add_header X-Content-Type-Options    "nosniff"            always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

        limit_conn conn_limit 50;

        # ── Health check (internal use) ───────
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ── Block Prometheus metrics endpoint ─
        location /metrics/ {
            return 403 "Forbidden";
        }

        # ── Static & Media files ──────────────
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # ── WebSocket connections ─────────────
        location /ws/ {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;

            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;

            limit_req zone=ws_limit burst=20 nodelay;
        }

        # ── Auth endpoints (stricter rate limit) ─
        location ~ ^/api/v1/(auth|token)/ {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;

            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            limit_req zone=auth_limit burst=5 nodelay;
        }

        # ── FastAPI / AI endpoints ────────────
        location /api/v2/ {
            proxy_pass         http://fastapi_backend;
            proxy_http_version 1.1;

            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 300s;
            limit_req zone=api_limit burst=30 nodelay;
        }

        # ── Django REST API ───────────────────
        location /api/v1/ {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;

            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id      $request_id;

            proxy_read_timeout    300s;
            proxy_connect_timeout  60s;

            limit_req zone=api_limit burst=60 nodelay;
        }

        # ── Django Admin ──────────────────────
        location /admin/ {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;

            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Restrict admin to internal networks only
            # allow 10.0.0.0/8;
            # allow 172.16.0.0/12;
            # deny all;
        }

        # ── Frontend SPA (fallback) ───────────
        location / {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;

            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ─────────────────────────────────────────
    # HTTPS Server – port 443 (enable when certs are ready)
    # ─────────────────────────────────────────
    # server {
    #     listen 443 ssl http2;
    #     server_name trademind.ai www.trademind.ai;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_session_timeout 1d;
    #     ssl_session_cache   shared:SSL:50m;
    #     ssl_session_tickets off;
    #
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    #
    #     # ... same location blocks as HTTP above ...
    # }
}
