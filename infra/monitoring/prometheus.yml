# =============================================================================
# TradeMind AI – Prometheus Configuration
# Scrapes metrics from all platform services
# =============================================================================

global:
  scrape_interval:     15s   # How frequently to scrape targets
  evaluation_interval: 15s   # How frequently to evaluate rules
  scrape_timeout:      10s   # Timeout for scrape requests

  # External labels attached to any time series or alerts
  external_labels:
    environment: production
    platform:    trademind-ai
    region:      ap-south-1

# ─────────────────────────────────────────
# Alertmanager configuration
# ─────────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# ─────────────────────────────────────────
# Rule files
# ─────────────────────────────────────────
rule_files:
  - /etc/prometheus/rules/*.yml

# =============================================================================
# Scrape Configurations
# =============================================================================
scrape_configs:

  # ── Prometheus self-monitoring ────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
    metrics_path: /metrics

  # ── Django REST API (Gunicorn + django-prometheus) ────────────────────────
  - job_name: django_api
    scrape_interval: 15s
    metrics_path: /metrics/
    static_configs:
      - targets: ["api:8000"]
        labels:
          service:  django
          role:     api
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # ── FastAPI service ────────────────────────────────────────────────────────
  - job_name: fastapi
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["fastapi:8001"]
        labels:
          service: fastapi
          role:    ai-api

  # ── Celery default worker (via celery-exporter or Prometheus middleware) ──
  - job_name: celery_worker
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets: ["celery_worker:9808"]
        labels:
          service: celery
          queue:   default
    relabel_configs:
      - source_labels: [__address__]
        regex: (.+):\d+
        target_label: instance

  # ── Scanner worker ─────────────────────────────────────────────────────────
  - job_name: scanner_worker
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["scanner_worker:9808"]
        labels:
          service: celery
          queue:   scanner

  # ── AI worker ──────────────────────────────────────────────────────────────
  - job_name: ai_worker
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets: ["ai_worker:9808"]
        labels:
          service: celery
          queue:   ai_scoring

  # ── Notification worker ────────────────────────────────────────────────────
  - job_name: notification_worker
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets: ["notification_worker:9808"]
        labels:
          service: celery
          queue:   notifications

  # ── PostgreSQL (via postgres_exporter) ────────────────────────────────────
  - job_name: postgres
    scrape_interval: 30s
    static_configs:
      - targets: ["postgres_exporter:9187"]
        labels:
          service: postgres
    # Uncomment when postgres_exporter container is running:
    # relabel_configs:
    #   - source_labels: [__address__]
    #     target_label: instance

  # ── Redis (via redis_exporter) ────────────────────────────────────────────
  - job_name: redis
    scrape_interval: 15s
    static_configs:
      - targets: ["redis_exporter:9121"]
        labels:
          service: redis

  # ── RabbitMQ (via rabbitmq_exporter or built-in Prometheus plugin) ────────
  - job_name: rabbitmq
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels:
          service: rabbitmq

  # ── Node Exporter (host metrics) ──────────────────────────────────────────
  - job_name: node_exporter
    scrape_interval: 30s
    static_configs:
      - targets: ["node_exporter:9100"]
        labels:
          service: node
    relabel_configs:
      - source_labels: [__address__]
        regex: (.+):\d+
        replacement: $1
        target_label: host

  # ── Nginx (via nginx_exporter) ────────────────────────────────────────────
  - job_name: nginx
    scrape_interval: 15s
    static_configs:
      - targets: ["nginx_exporter:9113"]
        labels:
          service: nginx

  # ── Grafana self-monitoring ────────────────────────────────────────────────
  - job_name: grafana
    scrape_interval: 60s
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          service: grafana
